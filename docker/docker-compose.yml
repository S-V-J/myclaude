version: '3.8'

services:
  myclaude:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: myclaude
    ports:
      - "4000:4000"   # nginx proxy
      - "4001:4001"   # LiteLLM backend
    environment:
      # Required: NVIDIA API Keys (at least PROJECT_1)
      - NVIDIA_API_KEY_PROJECT_1
      - NVIDIA_API_KEY_PROJECT_2
      - NVIDIA_API_KEY_PROJECT_3
      - NVIDIA_API_KEY_PROJECT_4

      # Optional: LiteLLM master key
      - LITELLM_MASTER_KEY

      # On-demand configuration
      - MYCLAUDE_IDLE_TIMEOUT=300  # 5 minutes default

      # Resource limits (adjust as needed)
      - MEMORY_LIMIT=2g
      - CPU_LIMIT=2.0

    volumes:
      # Persistent configuration
      - ../config.yaml:/app/config.yaml:ro
      - ../nginx-myclaude.conf:/etc/nginx/sites-enabled/myclaude:ro
      # Persistent logs
      - myclaude-logs:/var/log/myclaude
      # Optional: TLS certificates
      - ./certs:/etc/nginx/certs:ro

    # Resource limits
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2g}
          cpus: '${CPU_LIMIT:-2.0}'
        reservations:
          memory: 512m
          cpus: '0.5'

    # Restart policy for on-demand (don't auto-restart on stop)
    restart: "no"

    # Health check
    healthcheck:
      test: ["/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Security
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp/myclaude:exec,size=10m
      - /var/cache/nginx:exec,size=50m
      - /var/run:exec,size=10m

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Development profile with live reload
  myclaude-dev:
    extends: myclaude
    container_name: myclaude-dev
    profiles: ["dev"]
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - ../:/app:ro
      - ../config.yaml:/app/config.yaml:ro
      - ../nginx-myclaude.conf:/etc/nginx/sites-enabled/myclaude:ro
      - myclaude-logs:/var/log/myclaude
    environment:
      - MYCLAUDE_IDLE_TIMEOUT=60  # Shorter timeout for dev
      - LITELLM_LOG_LEVEL=DEBUG
    command: ["tail", "-f", "/dev/null"]  # Keep running for manual testing

volumes:
  myclaude-logs:
    driver: local