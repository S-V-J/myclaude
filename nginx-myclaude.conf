# MyClaude nginx reverse proxy with request queuing
# Limits: 20 concurrent, queues up to 50 additional requests
# This file will be installed to /etc/nginx/sites-enabled/myclaude

limit_req_zone $binary_remote_addr zone=myclaude:10m rate=16r/s;

server {
    listen 4000;
    server_name localhost;

    limit_req zone=myclaude burst=32 nodelay;
    limit_req_status 503;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
