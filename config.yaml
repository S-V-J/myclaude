# config.yaml
# ONE MODEL (Nemotron 3 Ultra) × 4 API KEYS = 4 deployments
# Each model name maps to a specific API key for load isolation
# Fallback: if PROJECT_2-4 keys not set, they fall back to PROJECT_1

litellm_settings:
  use_chat_completions_url_for_anthropic_messages: true
  num_retries: 3
  request_timeout: 3600
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: true
  max_parallel_requests: 8
  cache: false
  log_level: "WARNING"

general_settings:
  global_max_parallel_requests: 8
  request_timeout: 3600
  num_retries: 3
  health_check_interval: 300

router_settings:
  allowed_fails: 3
  retry_after: 5
  cooldown_time: 5
  routing_strategy: "least-busy"
  default_max_parallel_requests: 8

model_list:
  # Model 1: Default / Opus (1M context) → PROJECT_1
  - model_name: claude-opus-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_PROJECT_1
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
      drop_params: true
    model_info:
      mode: chat

  # Model 2: Sonnet → PROJECT_2 (fallback to PROJECT_1)
  - model_name: claude-sonnet-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_PROJECT_2
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
      drop_params: true
    model_info:
      mode: chat
    fallback_model: claude-opus-5

  # Model 3: Sonnet 5 (1M context) → PROJECT_3 (fallback to PROJECT_1)
  - model_name: claude-sonnet-5-1m
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_PROJECT_3
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
      drop_params: true
    model_info:
      mode: chat
    fallback_model: claude-opus-5

  # Model 4: Haiku → PROJECT_4 (fallback to PROJECT_1)
  - model_name: claude-haiku-4-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_PROJECT_4
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
      drop_params: true
    model_info:
      mode: chat
    fallback_model: claude-opus-5