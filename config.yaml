# config.yaml
litellm_settings:
  use_chat_completions_url_for_anthropic_messages: true
  num_retries: 3
  request_timeout: 3600
  master_key: os.environ/LITELLM_MASTER_KEY

general_settings:
  global_max_parallel_requests: 15
  request_timeout: 3600
  num_retries: 3

router_settings:
  allowed_fails: 3
  retry_after: 5
  cooldown_time: 5
  routing_strategy: "least-busy"
  default_max_parallel_requests: 15

model_list:
  # 🧠 1. DEFAULT / OPUS 5 (1M context) → Nemotron 3 Ultra
  - model_name: claude-opus-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
      rpm: 10
      tpm: 50000
      max_parallel_requests: 5
      drop_params: true
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
        reasoning_budget: 16384
      model_info:
        mode: chat

  # 🧠 2. SONNET 5 → StepFun Step-3.7-Flash
  - model_name: claude-sonnet-5
    litellm_params:
      model: nvidia_nim/stepfun-ai/step-3.7-flash
      api_key: os.environ/STEPFUN_API_KEY
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
      rpm: 10
      tpm: 50000
      max_parallel_requests: 5
      drop_params: true
      model_info:
        mode: chat

  # 🧠 3. SONNET 5 (1M context) → Minimax M3
  - model_name: claude-sonnet-5-1m
    litellm_params:
      model: nvidia_nim/minimaxai/minimax-m3
      api_key: os.environ/MINIMAX_API_KEY
      temperature: 1.0
      top_p: 0.95
      max_tokens: 8192
      rpm: 10
      tpm: 50000
      max_parallel_requests: 5
      drop_params: true
      model_info:
        mode: chat

  # 🧠 4. HAIKU → Poolside Laguna XS
  - model_name: claude-haiku-4-5
    litellm_params:
      model: nvidia_nim/poolside/laguna-xs-2.1
      api_key: os.environ/POOLSIDE_API_KEY
      temperature: 1.0
      top_p: 0.95
      max_tokens: 8192
      rpm: 30
      tpm: 50000
      max_parallel_requests: 5
      drop_params: true
      model_info:
        mode: chat