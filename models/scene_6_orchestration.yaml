# Scene 6: Backend AI Model Orchestration System
# Two primary router models (Ultra-550b, Super-120b) route to specialized worker models
# based on task analysis: coding, vision, fast-response, high-throughput, etc.

# ============================================================
# PRIMARY ROUTER MODELS (The "Brains" - analyze requests and route)
# ============================================================

# Router 1: Nemotron-3-Ultra-550b (KEY_1) - Primary router for complex tasks
- model_name: myclaude-router-ultra
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    api_key: os.environ/NVIDIA_API_KEY_1
    temperature: 0.3
    top_p: 0.95
    max_tokens: 16384
    drop_params: true
    num_retries: 3
    timeout: 120000
    chat_template_kwargs: {enable_thinking: true}
  model_info:
    mode: chat
    role: router
    capabilities: [reasoning, analysis, planning, complex_coding, architecture]

# Router 2: Nemotron-3-Super-120b (KEY_2) - Secondary router for balanced tasks
- model_name: myclaude-router-super
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
    api_key: os.environ/NVIDIA_API_KEY_2
    temperature: 0.3
    top_p: 0.95
    max_tokens: 16384
    drop_params: true
    num_retries: 3
    timeout: 120000
    chat_template_kwargs: {enable_thinking: true}
  model_info:
    mode: chat
    role: router
    capabilities: [reasoning, analysis, coding, general, fast_response]

# ============================================================
# SPECIALIZED WORKER MODELS (The "Hands" - execute specific tasks)
# ============================================================

# --- CODING SPECIALISTS ---
# DeepSeek Coder 6.7B - Fast, efficient code generation (KEY_3)
- model_name: myclaude-worker-coder-deepseek
  litellm_params:
    model: nvidia_nim/deepseek-ai/deepseek-coder-6.7b-instruct
    api_key: os.environ/NVIDIA_API_KEY_3
    temperature: 0.2
    top_p: 0.95
    max_tokens: 16384
    drop_params: true
    num_retries: 3
    timeout: 60000
  model_info:
    mode: chat
    role: worker
    specialization: coding
    languages: [python, javascript, typescript, go, rust, cpp, java, sql]
    strengths: [code_generation, debugging, refactoring, code_review, unit_tests]
    speed: fast
    context_window: 16384

