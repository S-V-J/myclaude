# Scene 6: Orchestration — ROUTERS + WORKERS
# LIVE-MODEL ONLY — verified by tests/probe_live_endpoints.py on 2026-10-22:
#   nvidia/nemotron-3-ultra-550b-a55b              OK (all 6 keys)
#   nvidia/nemotron-3.5-super-vl-120b-a12b         OK (stream + vision + reasoning verified)
#   nvidia/nemotron-3-nano-omni-30b-a3b-reasoning  OK (vision verified 5/6 keys)
#   nvidia/nemotron-3.5-lightning-30b-a3b          OK (no failure in live probe)
